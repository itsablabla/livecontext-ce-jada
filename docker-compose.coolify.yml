# Git-based Coolify Application. Base directory: /.
# All paths are relative to this repository root. No host ports are published.
# Configure only gateway :80 with a public domain in Coolify.
# See docker/COOLIFY.md before deployment.
services:
  gateway:
    build:
      context: ./docker/gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      livecontext:
        condition: service_healthy
    expose: ["80"]
    environment:
      BOOTSTRAP_AUTH_REALM: ${BOOTSTRAP_AUTH_REALM:-Setup}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: livecontext
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - livecontext_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - livecontext_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-livecontext}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - livecontext_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-livecontext}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb local/workflow-files --ignore-existing
    restart: "no"
    exclude_from_hc: true

  bridge:
    image: ghcr.io/livecontext-ai/livecontext-ce-bridge:v0.2.15
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8093"
      REDIS_URL: redis://redis:6379
      AGENT_CLI_URL: http://livecontext:8080
      CONVERSATION_SERVICE_URL: http://livecontext:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8093/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  livecontext:
    build:
      context: ./backend
      dockerfile: monolith-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-jada-source}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      bridge:
        condition: service_healthy
    expose: ["8080"]
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: livecontext
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_FILTER_SECRET_KEY: ${GATEWAY_FILTER_SECRET_KEY:?Set GATEWAY_FILTER_SECRET_KEY}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-livecontext}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: workflow-files
      STORAGE_SHOWCASE_HMAC_SECRET: ${STORAGE_SHOWCASE_HMAC_SECRET:?Set STORAGE_SHOWCASE_HMAC_SECRET}
      BRIDGE_ENABLED: "true"
      BRIDGE_SERVICE_URL: http://bridge:8093
      SERVICES_SCREENSHOT_RENDERER_URL: http://screenshot-renderer:8094
      WEBSEARCH_ENABLED: "true"
      WEBSEARCH_SERVICE_URL: http://websearch:8085
      WEBSEARCH_CALLBACK_BASE_URL: http://livecontext:8080
      WEBSEARCH_CDP_JWT_SECRET: ${WEBSEARCH_CDP_JWT_SECRET:?Set WEBSEARCH_CDP_JWT_SECRET}
      WEBSEARCH_GATEWAY_SECRET: ${WEBSEARCH_GATEWAY_SECRET:?Set WEBSEARCH_GATEWAY_SECRET}
      OAUTH2_FRONTEND_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL without trailing slash}
      OAUTH2_CALLBACK_URL: ${GATEWAY_PUBLIC_URL:?Set GATEWAY_PUBLIC_URL without trailing slash}/api/credentials/oauth2/callback
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      CE_VERSIONCHECK_SENDINSTALLID: "false"
      CATALOG_SEED_ENABLED: "true"
      CATALOG_SEED_PATH: /app/catalog-seeds
      LOGGING_FILE_NAME: /app/logs/livecontext-ce.log
      AUDIT_LOG_PATH: /app/logs/audit
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - livecontext_keys:/app/data/keys
      - livecontext_files:/app/data/files
      - livecontext_logs:/app/logs
      - ./catalog-seeds:/app/catalog-seeds:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s
    mem_limit: 2048m

  websearch:
    build:
      context: ./websearch-service
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      WEBSEARCH_REDIS_URL: redis://redis:6379/0
      WEBSEARCH_MINIO_ENDPOINT: minio:9000
      WEBSEARCH_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-livecontext}
      WEBSEARCH_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      WEBSEARCH_MINIO_BUCKET: workflow-files
      WEBSEARCH_MINIO_SECURE: "false"
      WEBSEARCH_GATEWAY_SECRET: ${WEBSEARCH_GATEWAY_SECRET:?Set WEBSEARCH_GATEWAY_SECRET}
      WEBSEARCH_CDP_JWT_SECRET: ${WEBSEARCH_CDP_JWT_SECRET:?Set WEBSEARCH_CDP_JWT_SECRET}
      WEBSEARCH_SEARXNG_URL: http://searxng:8080
      BROWSER_HEADLESS: "true"
    volumes:
      - livecontext_browser:/app/data/chrome_profile
    security_opt: ["seccomp:unconfined"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 2048m

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  screenshot-renderer:
    image: ghcr.io/livecontext-ai/livecontext-ce-screenshot-renderer:v0.2.15
    restart: unless-stopped
    environment:
      PORT: "8094"
      HOME: /tmp
    security_opt: ["seccomp:unconfined"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8094/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
    mem_limit: 1024m

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_EDITION: ce
        NEXT_PUBLIC_AUTH_MODE: embedded
        NEXT_PUBLIC_SPRING_BASE_URL: http://livecontext:8080
    restart: unless-stopped
    depends_on:
      livecontext:
        condition: service_healthy
    expose: ["3000"]
    environment:
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?Set GATEWAY_PUBLIC_URL}
      BACKEND_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/runtime-config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 1024m

volumes:
  livecontext_data:
  livecontext_redis:
  livecontext_minio:
  livecontext_keys:
  livecontext_files:
  livecontext_logs:
  livecontext_browser:
